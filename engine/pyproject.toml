[project]
name = "dishgraph"
version = "0.1.0"
description = "Движок графа достижимых блюд"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["gigachat>=0.2.4,<0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dishgraph", "dishgraph.recognition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
