name: REST API
on:
  pull_request:
    paths: ['server/**', 'engine/**', 'db/**', 'docs/api/**', 'deploy/**', '.github/workflows/server*.yml']
  push:
    branches: [main]
    paths: ['server/**', 'engine/**', 'db/**', 'docs/api/**', 'deploy/**', '.github/workflows/server*.yml']
permissions:
  contents: read
env:
  UPGRADE_BASE: 09d24f2098eb5c7a9dd6ba14e4e7e2046fa5750f
concurrency:
  group: server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: api_test_admin
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: almostdone_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U api_test_admin -d almostdone_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALMOSTDONE_TEST_DATABASE_URL: postgresql://api_test_admin:test-only-password@localhost:5432/almostdone_api_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable migration history
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$UPGRADE_BASE^{commit}"
          while IFS= read -r -d '' path; do
            [[ "$path" == *.sql ]] || continue
            reference=$UPGRADE_BASE
            if ! git cat-file -e "$UPGRADE_BASE:$path" 2>/dev/null; then
              reference=$(git log -1 --first-parent --diff-filter=A --format=%H "$BASE_SHA" -- "$path")
            fi
            if [[ -z "$reference" ]] || ! git diff --quiet "$reference" HEAD -- "$path"; then
              echo "::error file=$path::Restore the recorded migration and put SQL changes in a new migration."
              exit 1
            fi
          done < <(git ls-tree -r -z --name-only "$BASE_SHA" -- db/migrations/)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and engine
        run: python -m pip install -e ./engine -e './server[dev,postgres]'
      - name: Load the actual database dump
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U api_test_admin -d almostdone_api_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE koma'
          docker exec -i "$POSTGRES_CONTAINER" psql -X -q -U api_test_admin -d almostdone_api_test -v ON_ERROR_STOP=1 < db/schema.sql
          sed "s/SELECT pg_catalog.set_config('search_path', '', false);/SET search_path TO public, pg_catalog;/" db/seed.sql |
            docker exec -i "$POSTGRES_CONTAINER" psql -X -q -U api_test_admin -d almostdone_api_test -v ON_ERROR_STOP=1
      - name: Apply pending database migrations
        env:
          ALMOSTDONE_DATABASE_URL: ${{ env.ALMOSTDONE_TEST_DATABASE_URL }}
        run: python -m almostdone_server.migrate
      - name: Test REST API and PostgreSQL integration
        run: python -m pytest server/tests -q
      - name: Test engine
        working-directory: engine
        run: python -m pytest tests -q
      - name: Test deployment
        run: python -m unittest discover -s deploy

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: test-only-password
      ALMOSTREADY_IMAGE: almostready-api:${{ github.sha }}
      ALMOSTREADY_ENV_FILE: ${{ github.workspace }}/server/.env.example
      ALMOSTREADY_CADDYFILE: ${{ github.workspace }}/deploy/Caddyfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check production upgrade and monitoring on temporary PostgreSQL
        shell: bash
        run: |
          export ALMOSTREADY_STATUS_DIR="$RUNNER_TEMP/deploy-status"
          mkdir -p "$ALMOSTREADY_STATUS_DIR"
          upgrade_dir="$RUNNER_TEMP/previous-release"
          mkdir -p "$upgrade_dir"
          git archive "$UPGRADE_BASE" db server/docker-compose.yml server/init-db.sh | tar -x -C "$upgrade_dir"
          db=(docker compose -f "$upgrade_dir/server/docker-compose.yml")
          "${db[@]}" up -d --wait --wait-timeout 120 db
          docker network create --subnet 172.30.232.0/28 almostdone_edge
          docker volume create almostdone_caddy_data
          docker volume create almostdone_caddy_config
          compose=(docker compose -f deploy/compose.yml)
          config=$("${compose[@]}" config --format json)
          PYTHONPATH=deploy python3 -c 'import json, sys; from deploy import validate_ports; validate_ports(json.load(sys.stdin)["services"])' <<<"$config"
          caddy_image=$(jq -er '.services.caddy.image' <<<"$config")
          docker run --rm --network none --mount "type=bind,source=$ALMOSTREADY_CADDYFILE,target=/etc/caddy/Caddyfile,readonly" "$caddy_image" caddy validate --config /etc/caddy/Caddyfile
          docker build -f server/Dockerfile --build-arg "ALMOSTDONE_DEPLOY_REVISION=$GITHUB_SHA" -t "$ALMOSTREADY_IMAGE" .
          "${compose[@]}" run --rm --no-deps -T --volume "$upgrade_dir/db/migrations:/previous-migrations:ro" \
            migrate python -m almostdone_server.migrate --migrations-dir /previous-migrations
          density() {
            "${db[@]}" exec -T db psql -X -At -U koma -d almostdone -v ON_ERROR_STOP=1 \
              -c "SELECT coalesce(grams_per_ml::text, 'missing') FROM public.ingredients WHERE code = 'ing_80ec6ff28b539412'"
          }
          [[ $(density) == missing ]]
          "${compose[@]}" run --rm --no-deps -T migrate
          [[ $(density) == 1.1100 ]]
          "${compose[@]}" up -d --no-deps --no-build --wait --wait-timeout 120 api
          revision=$(curl -fsS --max-time 10 -o "$RUNNER_TEMP/readiness.json" -w '%header{x-almostready-revision}' http://127.0.0.1:8000/api/v1/health/ready)
          [[ "$revision" == "$GITHUB_SHA" ]]
          jq -e '.status == "ok"' "$RUNNER_TEMP/readiness.json"
          PYTHONPATH=deploy python3 - <<'PY'
          import os
          from pathlib import Path
          from deploy import Deployment, check_monitoring

          os.umask(0o077)
          root = Path(os.environ["RUNNER_TEMP"]) / "monitoring"
          root.mkdir()
          deployment = Deployment(root, Path.cwd())
          deployment.repository = Path.cwd() / ".git"
          deployment.env_file = Path(os.environ["ALMOSTREADY_ENV_FILE"])
          sha = os.environ["GITHUB_SHA"]
          deployment.start_monitoring(sha, deployment.monitoring_config({"sha": sha}))
          check_monitoring()
          PY
