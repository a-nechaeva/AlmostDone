              description: 'Версия общего состояния пользователя: "state-7".'
            Cache-Control:
              schema:
                type: string
              description: no-store для персональных ответов и токенов.
        '401':
          description: 'Неизвестная/истёкшая/отозванная сессия; WWW-Authenticate: Bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: 'Один серверный контекст запасов+профиля+фильтров. Только suitability=allowed и известные
        количества/цены подтверждают бюджет. single-purchase: одна упаковка, максимум альтернативных блюд,
        tie-break цена ASC, package_id ASC. budget: максимум альтернативных блюд в пределах бюджета, tie-break
        общая цена ASC, стабильный список package_id; D6 требует подтверждения движком. Альтернативы не
        обещают одновременное приготовление. Неизвестные оценки — unpriced_recipe_ids и недостаточность
        данных, не бесплатные покупки. found имеет непустые items и известный total_cost<=budget; no_plan
        имеет пустые items, total_cost=null; insufficient_data тоже не обещает план. При выборе filters.mode=now
        возможен no_plan: фильтры применяются буквально. Изменений списка покупок/запасов нет.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
  /recognitions:
    post:
      operationId: recognitions_create
      summary: Загрузить фото/скриншот чека или фото продуктов
      tags:
      - recognitions
      x-issues:
      - 11
      - 17
      - 24
      responses:
        '202':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recognition'
          headers:
            ETag:
              schema:
                type: string
              description: 'Версия общего состояния пользователя: "state-7".'
            Cache-Control:
              schema:
                type: string
              description: no-store для персональных ответов и токенов.
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '401':
          description: 'Неизвестная/истёкшая/отозванная сессия; WWW-Authenticate: Bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '409':
          description: unit_conflict, idempotency_conflict, operation_in_progress, context_changed, snapshot_expired
            или already_imported. Для operation_in_progress вернуть Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 'file_too_large: фото превышает 10 MiB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 'unsupported_media_type: разрешены только декодируемые JPEG/PNG.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: 'D3: async; multipart kind=receipt для фото/скриншота электронного чека, kind=products
        для фото продуктов в холодильнике или на столе. JPEG/PNG <=10 MiB, <=25 мегапикселей после декодирования;
        проверять фактический формат. PDF и другие файлы электронных чеков пока не поддерживаются. Для
        products предлагать только видимые продукты; неизвестное количество возвращать null. Idempotency
        fingerprint включает kind, байты файла и MIME; другой kind с тем же ключом — 409. До подтверждённого
        импорта запасы не меняются. 202 может содержать queued/processing/succeeded; Location указывает
        GET задачи, Retry-After=2. D4: фото удалить после обработки, не позднее 24ч; результат хранить
        24ч. Не логировать изображения/сырые строки. Лимиты и timeout — предложения для согласования в
        x-review-decisions.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecognitionUpload'
            encoding:
              file:
                contentType: image/jpeg, image/png
  /recognitions/{recognition_id}:
    get:
      operationId: recognitions_status
      summary: Статус и результат распознавания чека или продуктов
      tags:
      - recognitions
      x-issues:
      - 11
      - 24
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recognition'
          headers:
            ETag:
              schema:
                type: string
              description: 'Версия общего состояния пользователя: "state-7".'
            Cache-Control:
              schema:
                type: string
              description: no-store для персональных ответов и токенов.
        '401':
          description: 'Неизвестная/истёкшая/отозванная сессия; WWW-Authenticate: Bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '404':
          description: Ресурс не найден или принадлежит другому пользователю; не раскрывать существование
            чужого ресурса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: 'Только владелец. kind сохраняется из запроса загрузки. После истечения срока — 404.
        queued/processing: items=[], failure=null. succeeded: items могут быть пустыми; failed: items=[],
        failure содержит Error. Пользователь исправляет canonical-позиции через поиск и подтверждает выбранные
        строки. Для фото продуктов неизвестное количество остаётся null. Poll по poll_after_seconds, после
        терминального состояния остановить. Ошибка распознавания внутри 200 failed — результат задачи;
        HTTP 503 означает недоступность самого сервиса.'
      parameters:
      - name: recognition_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
  /recognition-imports:
    post:
      operationId: recognitions_import
      summary: Подтвердить и атомарно добавить распознанные продукты
      tags:
      - recognitions
      x-issues:
      - 11
      - 17
      - 24
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          headers:
            ETag:
              schema:
                type: string
              description: 'Версия общего состояния пользователя: "state-7".'
            Cache-Control:
              schema:
                type: string
              description: no-store для персональных ответов и токенов.
        '401':
          description: 'Неизвестная/истёкшая/отозванная сессия; WWW-Authenticate: Bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '404':
          description: Ресурс не найден или принадлежит другому пользователю; не раскрывать существование
            чужого ресурса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: unit_conflict, idempotency_conflict, operation_in_progress, context_changed, snapshot_expired
            или already_imported. Для operation_in_progress вернуть Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: 'state_conflict: перечитать состояние, согласовать изменение и повторить с актуальным
            If-Match.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: 'precondition_required: отсутствует If-Match.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: Сначала вернуть сохранённый успешный replay с тем же ключом, даже с устаревшим If-Match
        или истёкшим результатом распознавания. Для новой операции проверить успешную задачу владельца
        и совпадение kind. Каждый line_id принадлежит задаче и встречается один раз; ingredient_id можно
        исправить на известный canonical ID. Для receipt количество >0 и единица подтверждены; для products
        допустимо явно подтвердить неизвестное количество как null. Ноль отклоняется. Несколько строк
        одного ингредиента суммировать только после проверки единиц; неизвестный итог остаётся null. Любая
        ошибка откатывает весь импорт. На один recognition_id — один успешный импорт; другой ключ после
        успеха даёт 409 already_imported, оставшиеся строки не импортируются позже. Ledger и запасы фиксировать
        одной транзакцией. После timeout повторять тот же запрос с тем же ключом. Обычные 4xx не расходуют
        ключ; успешные ответы сохраняются 30 дней, после срока автоматический replay запрещён. Постоянная
        уникальность recognition_id защищает импорт после удаления фото/результата. После успеха обновить
        продукты, подбор и рецепт.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecognitionImport'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Opaque серверный access token. Пользователь определяется только по проверенной сессии,
        не по user_id из запроса.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag общей версии пользователя, например "state-7". Не wildcard. 412 — версия устарела,
        428 — заголовок отсутствует.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID операции. Сохранять при timeout/повторе. Scope=user+method+path; повтор возвращает
        исходные status/body/ETag до проверки If-Match. Другой payload с тем же ключом — 409.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Непрозрачный cursor; привязан к запросу, пользователю, снимку/версии и размеру страницы.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Quantity:
      type: object
      properties:
        value:
          type: number
          minimum: 0
          maximum: 1000000
        unit:
          type: string
          enum:
          - g
          - ml
          - pcs
      required:
      - value
      - unit
      additionalProperties: false
    Money:
      type: object
      properties:
        minor_units:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - RUB
      required:
      - minor_units
      - currency
      additionalProperties: false
      description: Целые копейки. Неизвестные деньги представлены null вместо объекта.
    Source:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - name
      - url
      - observed_at
      additionalProperties: false
    Offer:
      type: object
      properties:
        package_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        quantity:
          $ref: '#/components/schemas/Quantity'
        price:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        source:
          anyOf:
          - $ref: '#/components/schemas/Source'
          - type: 'null'
      required:
      - package_id
      - quantity
      - price
      - source
      additionalProperties: false
    AllergenAssessment:
      type: object
      properties:
        contains:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
          uniqueItems: true
        completeness:
          type: string
          enum:
          - complete
          - incomplete
          - unknown
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
      required:
      - contains
      - completeness
      - sources
      additionalProperties: false
      description: Пустой contains при incomplete/unknown не доказывает отсутствие аллергенов. Лактоза
        отличается от молочного белка.
    Ingredient:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        name:
          type: string
        allowed_units:
          type: array
          items:
            type: string
            enum:
            - g
            - ml
            - pcs
          minItems: 1
          uniqueItems: true
        is_favorite:
          type: boolean
        allergens:
          $ref: '#/components/schemas/AllergenAssessment'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
      required:
      - id
      - name
      - allowed_units
      - is_favorite
      - allergens
      - offers
      additionalProperties: false
    DictionaryEntry:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        name:
          type: string
        support:
          type: string
          enum:
          - supported
          - unsupported
          - informational
      required:
      - id
      - name
      - support
      additionalProperties: false
    Dictionary:
      type: object
      properties:
        catalog_version:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        items:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryEntry'
      required:
      - catalog_version
      - items
      additionalProperties: false
    Preferences:
      type: object
      properties:
        food_type:
          type: string
          enum:
          - any
          - vegetarian
          - vegan
        excluded_allergens:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
          uniqueItems: true
        gluten_free:
          type: boolean
        lactose_free:
          type: boolean
        diabetes:
          type: boolean
        diet_table_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
          - type: 'null'
      required:
      - food_type
      - excluded_allergens
      - gluten_free
      - lactose_free
      - diabetes
      - diet_table_id
      additionalProperties: false
    Profile:
      type: object
      properties:
        user_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        display_name:
          anyOf:
          - type: string
          - type: 'null'
        preferences:
          $ref: '#/components/schemas/Preferences'
        unsupported_restrictions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        state_version:
          type: integer
          minimum: 0
          description: Общая монотонная версия серверных данных текущего пользователя.
      required:
      - user_id
      - display_name
      - preferences
      - unsupported_restrictions
      - state_version
      additionalProperties: false
    ProfileUpdate:
      type: object
      properties:
        preferences:
          $ref: '#/components/schemas/Preferences'
      required:
      - preferences
      additionalProperties: false
      description: Полное сохранение черновика настроек. Back/Отмена не отправляет запрос.
    State:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 0
          description: Общая монотонная версия серверных данных текущего пользователя.
        catalog_version:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        user_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
      required:
      - state_version
      - catalog_version
      - user_id
      additionalProperties: false
    PantryItem:
      type: object
      properties:
        ingredient_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        name:
          type: string
        quantity:
          anyOf:
          - $ref: '#/components/schemas/PositiveQuantity'
          - type: 'null'
      required:
      - ingredient_id
      - name
      - quantity
      additionalProperties: false
      description: Сохранённое количество положительное либо неизвестно (null). Нулевой остаток удаляет
        строку.
    Pantry:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 0
          description: Общая монотонная версия серверных данных текущего пользователя.
        items:
          type: array
          items:
            $ref: '#/components/schemas/PantryItem'
      required:
      - state_version
      - items
      additionalProperties: false
    PantrySet:
      type: object
      properties:
        quantity:
          anyOf:
