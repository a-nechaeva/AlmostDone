openapi: 3.1.0
info:
  title: AlmostDone OPEN API
  version: 0.3.0-draft
servers:
- url: /api/v1
security:
- BearerAuth: []
paths:
  /health:
    get:
      operationId: health_get
      summary: Проверка процесса
      tags:
      - health
      x-issues:
      - 27
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  api_version:
                    type: string
                    enum:
                    - v1
                required:
                - status
                - api_version
                additionalProperties: false
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      security: []
  /health/ready:
    get:
      operationId: readiness_get
      summary: Проверка готовности API и обязательных зависимостей
      description: >-
        Проверяет доступ к хранилищу, таблицам и журналу миграций PostgreSQL,
        загруженный каталог и движок dishgraph. Внешние Яндекс и GigaChat
        не вызываются: configured означает только наличие локальной настройки,
        disabled — функция отключена. Проверка не выполняет запись в БД.
      tags:
      - health
      security: []
      responses:
        '200':
          description: API готов обслуживать запросы
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, api_version, checks]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  api_version:
                    type: string
                    enum: [v1]
                  checks:
                    type: object
                    additionalProperties: false
                    required: [storage, engine, catalog, yandex, recognition]
                    properties:
                      storage:
                        type: string
                        enum: [ok]
                      engine:
                        type: string
                        enum: [ok]
                      catalog:
                        type: string
                        enum: [ok]
                      yandex:
                        type: string
                        enum: [configured, disabled]
                      recognition:
                        type: string
                        enum: [configured, disabled]
        '503':
          description: Обязательная зависимость недоступна или миграции не применены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/yandex:
    post:
      operationId: auth_yandex
      summary: Обмен OAuth-токена Яндекса на сессию приложения
      tags:
      - auth
      x-issues:
      - 8
      - 17
      - 21
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 'invalid_credentials: OAuth-токен недействителен, истёк, отозван или выдан другому приложению.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: 'Android передаёт OAuth-токен, полученный через LoginSDK Яндекс ID. Backend проверяет
        его запросом GET https://login.yandex.ru/info?format=json с заголовком Authorization: OAuth <oauth_token>.
        client_id из ответа должен совпадать с настроенным на backend client_id приложения; иначе 401
        invalid_credentials. Недействительный, истёкший или отозванный токен также даёт 401 invalid_credentials;
        недоступность Яндекса — 503 service_unavailable. Identity=(yandex, id из ответа Яндекса).
        Email не объединяет аккаунты. Backend выдаёт собственную Session с изоляцией по внутреннему user_id.
        OAuth-токен провайдера не является сессией приложения и не логируется.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YandexExchange'
  /auth/refresh:
    post:
      operationId: auth_refresh
      summary: Ротация серверной сессии
      tags:
      - auth
      x-issues:
      - 17
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 'Неизвестная/истёкшая/отозванная сессия; WWW-Authenticate: Bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: 'Старый refresh одноразовый, повторное использование отзывает семейство. Автоматически
        повторять после timeout нельзя; повторный вход. Не требует access token.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
  /auth/logout:
    post:
      operationId: auth_logout
      summary: Отозвать текущую сессию и её refresh family
      tags:
      - auth
      x-issues:
      - 17
      - 25
      responses:
        '204':
          description: Успешно
          headers:
            ETag:
              schema:
                type: string
              description: 'Версия общего состояния пользователя: "state-7".'
            Cache-Control:
              schema:
                type: string
              description: no-store для персональных ответов и токенов.
        '401':
          description: 'Неизвестная/истёкшая/отозванная сессия; WWW-Authenticate: Bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
