                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: Остальные устройства не затрагиваются. После 204 очистить локальные account-scoped
        данные. При 401 тоже очистить локальную сессию; сервер не подтверждает отзыв неизвестного токена.
