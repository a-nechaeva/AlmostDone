      description: Общий результат OCR чека или распознавания продуктов. succeeded с пустым items — пустое
        распознавание. failed имеет failure, остальные состояния failure=null. Запасы не меняются.
    PositiveQuantity:
      allOf:
      - $ref: '#/components/schemas/Quantity'
      - properties:
