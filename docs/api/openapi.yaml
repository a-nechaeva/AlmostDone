          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: Неподдерживаемое ограничение сохраняется нейтрально и возвращается в unsupported_restrictions;
        подбор не объявляет соответствие ему. После успешного сохранения инвалидировать подбор/рецепт.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
