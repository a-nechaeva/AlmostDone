        recognition_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        state_version:
          type: integer
          minimum: 0
          description: Общая монотонная версия серверных данных текущего пользователя.
        pantry:
          type: array
          items:
            $ref: '#/components/schemas/PantryItem'
      required:
      - operation_id
      - recognition_id
      - state_version
      - pantry
      additionalProperties: false
