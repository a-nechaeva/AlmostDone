        kind:
          $ref: '#/components/schemas/RecognitionKind'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImportItem'
          minItems: 1
          uniqueItems: true
      required:
      - recognition_id
      - kind
      - items
      additionalProperties: false
      description: kind должен совпадать с сохранённой задачей. line_id относится к её результату и не
        повторяется.
      allOf:
      - if:
          properties:
            kind:
