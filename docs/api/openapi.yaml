          - succeeded
          - failed
        expires_at:
          type: string
          format: date-time
        poll_after_seconds:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecognitionLine'
        failure:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - id
      - kind
      - status
      - expires_at
      - poll_after_seconds
      - items
      - failure
