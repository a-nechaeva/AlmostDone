        ingredient_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
        quantity:
          anyOf:
          - $ref: '#/components/schemas/PositiveQuantity'
          - type: 'null'
      required:
      - line_id
      - ingredient_id
      - quantity
      additionalProperties: false
      description: Только выбранные и подтверждённые canonical-позиции. Для receipt количество обязательно
