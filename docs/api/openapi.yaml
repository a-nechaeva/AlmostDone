              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      description: >-
        Ингредиенты масштабируются на servings; минуты — общее время, nutrition — на порцию.
        missing cost — целые докупаемые упаковки. Сохранённый дома продукт с quantity=null считается
        достаточным на любое servings: для него available=null, availability=enough, shortage=0
        в единице required либо null, если единицу определить нельзя. Он не попадает в shopping_items
        и не увеличивает missing_count или buy_cost; его ID остаётся в unknown_quantity_ids как подсказка.
        Неизвестное требуемое количество в самом рецепте не приравнивается к достаточному запасу. Необязательные
        ингредиенты явно отмечены, потенциальные аллергены не теряются. shopping_items — только однозначно
        определённые упаковки; неизвестные показываются через ingredients. После мутации перечитать тот
        же ID. GET не резервирует и не списывает продукты.
        Временные exclude_allergens дополняют excluded_allergens текущего профиля (объединение без
        дубликатов) и не сохраняются в профиль. recipe.suitability и причины рассчитываются по этим
        объединённым ограничениям так же, как в подборе. При неизменных профиле и каталоге одинаковый
        контекст исключений должен давать одинаковый статус и причины. Скрытый по аллергенам рецепт
        доступен по ID с suitability=hidden и соответствующими причинами; ограничение не превращается
        в 404. Сведения об аллергенах и их полноте не теряются.
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Непрозрачный canonical ID. Не преобразовывать в число и не разбирать.
      - name: servings
        description: При переходе из подбора или плана покупок клиент обязан передать servings из ответа; default используется только при самостоятельном открытии рецепта.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 12
          default: 2
      - name: exclude_allergens
        in: query
        required: false
        style: form
        explode: true
        description: >-
          Временные исключения аллергенов. При переходе из подбора (включая скрытые рецепты и граф)
          или плана покупок Android передаёт filters.exclude_allergens из запроса, создавшего этот
          результат, а не из изменённого впоследствии состояния фильтров. При повторном запросе деталей
          и изменении порций сохраняет этот список. Отсутствие параметра означает пустой список
          временных исключений; ограничения профиля применяются всегда. Неизвестный ID — 422
          validation_error. Несколько ID передаются повторением параметра:
          ?exclude_allergens=peanut&exclude_allergens=milk (условные ID; используются ID справочника).
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          uniqueItems: true
          default: []
