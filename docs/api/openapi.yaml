        даёт null. Несовместимые единицы — 409 unit_conflict, неизвестный ID или переполнение — 422. Все
        строки, одна новая state_version и успешный идемпотентный ответ фиксируются одной транзакцией;
        при любой ошибке запасы и версия не меняются. Повтор с прежним Idempotency-Key возвращает исходный
        status/body/ETag до проверки If-Match, без повторного сложения. Одинаковый ключ с другим телом
        — 409. Успешный replay хранится 30 дней; после срока не повторять автоматически. Android сохраняет
        ключ и снимок выбранных строк до подтверждения; только после успеха или успешного replay снимает
        их отметки/обновляет локальный список и перечитывает подбор/рецепт. Сервер не хранит локальный
        список покупок.
