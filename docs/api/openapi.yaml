      description: 'D1: flow и поля SDK требуют согласования. Сервер проверяет код у провайдера и его
        client/redirect/PKCE binding; client_id и секрет провайдера — конфигурация backend. Identity=(provider,
        subject). Email не объединяет аккаунты. Серверные сессии изолированы по внутреннему user_id. Коды
        и токены не логировать.'
