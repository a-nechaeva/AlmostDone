openapi: 3.1.0
info:
  title: AlmostDone OPEN API
  version: 0.3.0-draft
security:
- BearerAuth: []
paths:
  /health:
    get:
      operationId: health_get
      summary: Проверка процесса
      tags:
      - health
      x-issues:
      - 27
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  api_version:
                    type: string
                    enum:
                    - v1
                required:
                - status
                - api_version
                additionalProperties: false
        '422':
          description: 'validation_error: ошибки полей, неизвестный canonical ID, повтор line_id или некорректное
            количество.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'rate_limited: повторять после Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
        '503':
          description: 'service_unavailable: временная недоступность каталога/движка/провайдера/OCR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Секунды до повтора; для 503 может отсутствовать.
      security: []
