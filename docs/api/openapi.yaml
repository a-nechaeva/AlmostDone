      description: Стабильный порядок relevance DESC, id ASC. Cursor связан с q, limit и catalog_version/state_version;
        изменение контекста — 409, начать сначала. Android отменяет устаревшие запросы.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /me/pantry:
    get:
      operationId: pantry_get
      summary: Все продукты дома
      tags:
      - pantry
      x-issues:
      - 18
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pantry'
          headers:
