[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almostdone-server"
version = "0.1.0"
description = "Local FastAPI implementation of the AlmostDone REST contract"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.18,<1",
  "Pillow>=11,<13",
  "prometheus-client>=0.21,<1",
  "certifi",  # фото рецептов: python.org-Python на macOS не видит системные сертификаты
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2.4,<4"]
llm = ["gigachat>=0.2.4,<0.3"]
engine = ["dishgraph @ git+https://github.com/a-nechaeva/AlmostDone.git@22c171f70141afb4ef1ef4e48b4d2f97ceb2b9a1#subdirectory=engine"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

